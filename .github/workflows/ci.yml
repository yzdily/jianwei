name: CI

on:
  push:
    branches: [main, maintain]
  pull_request:

jobs:
  # 全量测试（含 Web / 工作台 / 三测试集 / L4-L5 / AI 矩阵）
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run full test suite
        run: python -m pytest tests/ -q

  # 零依赖门禁：屏蔽第三方依赖，验证 MVP 工作台仍可导入/可用
  zerodep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal (pytest only)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
      - name: Zero-dependency workbench tests
        run: python -m pytest tests/test_digpool_zerodep.py -q

  # 覆盖率门禁（仅报告，不强制阈值，先建立基线）
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Coverage
        run: python -m pytest tests/ -q --cov=core --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
