[pytest]
asyncio_mode = auto
# 默认排除浏览器 E2E：Playwright 同步 API 会在进程内占用事件循环，
# 与 pytest-asyncio 的异步用例同进程运行会互相干扰（RuntimeError: Runner.run() ...）。
# 单测快跑：  pytest           （等价 -m "not e2e"）
# 端到端：    pytest -m e2e
addopts = -m "not e2e"
markers =
    e2e: 端到端测试（Playwright + 真实浏览器 + 本地 uvicorn；单独跑：pytest -m e2e）
