<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鉴微 JianWei · AI 安全测试平台</title>
<meta name="description" content="鉴微 JianWei —— 由玄鉴引擎驱动的 AI 安全测试平台统一控制台" />
<link rel="stylesheet" href="/static/css/tokens.css" />
<link rel="stylesheet" href="/static/css/shell.css" />
<link rel="stylesheet" href="/static/css/components.css" />
</head>
<body>
<div class="app">
  <!-- ============ 侧栏 ============ -->
  <aside class="side">
    <div class="brand">
      <span class="mark" aria-hidden="true">J</span>
      <div>
        <b>鉴微 JianWei</b>
        <small>AI 安全测试平台 · 统一控制台</small>
      </div>
    </div>
    <!-- 导航由 JW.viewList 渲染（单一事实源在各 view 模块） -->
    <nav class="nav main-nav" id="side-nav" aria-label="主导航"></nav>
    <div class="spacer"></div>
    <div class="side-note">
      由玄鉴 XuanJian 引擎驱动（持续维护）。平台层零侵入扩展，不修改引擎源码。
    </div>
  </aside>

  <!-- ============ 主区 ============ -->
  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb">鉴微 / <b>加载中</b></div>
      <div class="right">
        <span class="pill-tag" id="api-mode" data-testid="api-mode">检测中</span>
        <div class="user-wrap">
          <div class="user-card" id="user-card" data-testid="user-card" role="button" tabindex="0"
               aria-haspopup="true" aria-expanded="false">
            <span class="avatar" aria-hidden="true">研</span>
            <span class="uc-b"><b>研究员</b><small>Researcher · local</small></span>
            <span class="uc-arrow" aria-hidden="true">▾</span>
          </div>
          <div class="user-menu" id="user-menu" data-testid="user-menu" role="menu">
            <button data-um="profile" role="menuitem"><span class="um-num">01</span>账号资料</button>
            <button data-um="downloads" role="menuitem"><span class="um-num">02</span>下载记录</button>
            <button data-um="version" role="menuitem"><span class="um-num">03</span>版本信息</button>
            <button data-um="engine" role="menuitem"><span class="um-num">04</span>自研引擎</button>
            <button data-um="logout" class="danger" role="menuitem"><span class="um-num">05</span>退出登录</button>
          </div>
        </div>
      </div>
    </header>

    <!-- 各视图 section 由路由按需创建 -->
    <main class="content" id="content"></main>
  </div>
</div>

<!-- 通用信息弹窗 -->
<div class="mask" id="m-mask" data-testid="m-mask" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-tt">
    <div class="modal-tt">
      <h3 id="m-tt">信息</h3>
      <button class="btn ghost sm" id="m-close" aria-label="关闭">关闭</button>
    </div>
    <div class="m-sub" id="m-sub"></div>
    <div id="m-body"></div>
  </div>
</div>

<noscript>
  <div class="panel" style="margin:24px">
    本控制台需要启用 JavaScript 才能加载视图与调用平台 API。
  </div>
</noscript>

<!-- 加载顺序：客户端 → UI 工具 → 各视图模块（向 JW.viewList 注册）→ 应用外壳 -->
<script src="/static/js/api.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/views/scan.js"></script>
<script src="/static/js/views/skill.js"></script>
<script src="/static/js/views/agent.js"></script>
<script src="/static/js/views/report.js"></script>
<script src="/static/js/views/bench.js"></script>
<script src="/static/js/views/metrics.js"></script>
<script src="/static/js/views/health.js"></script>
<script src="/static/js/views/system.js"></script>
<script src="/static/js/views/rbac.js"></script>
<script src="/static/js/login.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
